name: Build X-RAY LINK Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platform-tools"

      - name: Build Client APK
        working-directory: android-client
        run: gradle assembleDebug

      - name: Build Admin APK
        working-directory: android-admin
        run: gradle assembleDebug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: XRayLink-Client-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: XRayLink-Admin-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
