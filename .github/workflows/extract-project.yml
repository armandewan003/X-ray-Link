name: Extract X-RAY LINK Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "x-ray-link.zip" ]; then
            echo "ERROR: x-ray-link.zip not found in repository root"
            exit 1
          fi

          mkdir -p /tmp/xray-extract

          unzip -q x-ray-link.zip -d /tmp/xray-extract

          if [ ! -d "/tmp/xray-extract/x-ray-link" ]; then
            echo "ERROR: Expected x-ray-link folder not found inside ZIP"
            exit 1
          fi

          cp -a /tmp/xray-extract/x-ray-link/. .

          echo "Project extracted successfully"

          ls -la
          ls -la android-client
          ls -la android-admin

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "Extract X-RAY LINK project into repository root"
            git push
          fi
