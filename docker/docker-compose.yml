services:
  postgres:
    image: postgres:16-alpine
    container_name: xraylink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xraylink
      POSTGRES_USER: ${POSTGRES_USER:-xraylink_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xraylink_admin} -d xraylink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xraylink-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: xraylink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-xraylink_admin}:${POSTGRES_PASSWORD}@postgres:5432/xraylink
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
    ports:
      - "127.0.0.1:4000:4000"

  web-admin:
    build:
      context: ../web-admin
      dockerfile: ../docker/Dockerfile.web-admin
    container_name: xraylink-web-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.xraylink.example.com}
    ports:
      - "127.0.0.1:3001:3000"

  reseller-panel:
    build:
      context: ../reseller-panel
      dockerfile: ../docker/Dockerfile.reseller-panel
    container_name: xraylink-reseller-panel
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.xraylink.example.com}
    ports:
      - "127.0.0.1:3002:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: xraylink-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - web-admin
      - reseller-panel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deployment/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pgdata:
  redisdata:
